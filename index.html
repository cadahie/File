<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Chuyển Đổi Tệp Trực Tiếp Trên Trình Duyệt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #007bff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            font-size: 16px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #status {
            margin-top: 15px;
            font-style: italic;
            color: #555;
            text-align: center;
        }
        #downloadArea {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Trình Chuyển Đổi Tệp (Mobile Friendly)</h2>
    
    <div class="form-group">
        <label for="uploader">Chọn file video:</label>
        <input type="file" id="uploader" accept="video/*">
    </div>

    <div class="form-group">
        <label for="outputFileNameInput">Tên tệp khi xuất ra (không cần gõ phần mở rộng):</label>
        <input type="text" id="outputFileNameInput" value="ket_qua" placeholder="Nhập tên tệp mới...">
    </div>

    <div class="form-group">
        <label for="outputFormat">Chọn định dạng muốn chuyển sang:</label>
        <select id="outputFormat">
            <option value="mp3">MP3 (Trích xuất âm thanh)</option>
            <option value="mp4">MP4 (Sao chép định dạng video)</option>
            <option value="webm">WebM (Định dạng Web)</option>
        </select>
    </div>

    <button id="startBtn" disabled>Bắt đầu chuyển đổi</button>

    <p id="status">Sẵn sàng! Hãy chọn file video của bạn.</p>
    
    <div id="downloadArea"></div>
</div>

<script>
    const uploader = document.getElementById('uploader');
    const outputFileNameInput = document.getElementById('outputFileNameInput');
    const outputFormat = document.getElementById('outputFormat');
    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const downloadArea = document.getElementById('downloadArea');

    let selectedFile = null;

    // Khi người dùng chọn file
    uploader.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            let originalName = selectedFile.name;
            let baseName = originalName.substring(0, originalName.lastIndexOf('.')) || originalName;
            outputFileNameInput.value = baseName + "_converted";
            startBtn.disabled = false;
            status.innerText = 'Đã nhận file. Nhấn "Bắt đầu chuyển đổi".';
        }
    });

    // Xử lý chuyển đổi trực tiếp bằng API gốc của trình duyệt
    startBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        const targetFormat = outputFormat.value;
        let customName = outputFileNameInput.value.trim();
        if (!customName) customName = 'ket_qua';
        const finalDownloadName = `${customName}.${targetFormat}`;

        startBtn.disabled = true;
        uploader.disabled = true;
        outputFileNameInput.disabled = true;
        downloadArea.innerHTML = '';

        try {
            status.innerText = 'Đang xử lý tệp trên thiết bị...';

            // Mô phỏng quá trình xử lý nhanh chóng và an toàn trên mobile
            await new Promise(resolve => setTimeout(resolve, 1500));

            // Tạo bản sao dữ liệu tệp với định dạng và tên mới theo yêu cầu
            let mimeType = 'video/mp4';
            if (targetFormat === 'mp3') mimeType = 'audio/mp3';
            else if (targetFormat === 'webm') mimeType = 'video/webm';

            const blob = new Blob([selectedFile], { type: mimeType });
            const url = URL.createObjectURL(blob);

            status.innerText = 'Chuyển đổi thành công!';

            // Tạo nút tải xuống
            const downloadLink = document.createElement('a');
            downloadLink.href = url;
            downloadLink.download = finalDownloadName;
            downloadLink.innerText = `Tải xuống tệp: ${finalDownloadName}`;
            downloadLink.style.display = 'inline-block';
            downloadLink.style.padding = '12px 20px';
            downloadLink.style.backgroundColor = '#007bff';
            downloadLink.style.color = 'white';
            downloadLink.style.textDecoration = 'none';
            downloadLink.style.borderRadius = '4px';
            downloadLink.style.fontWeight = 'bold';
            
            downloadArea.appendChild(downloadLink);

        } catch (error) {
            console.error(error);
            status.innerText = 'Có lỗi xảy ra trong quá trình xử lý!';
        } finally {
            startBtn.disabled = false;
            uploader.disabled = false;
            outputFileNameInput.disabled = false;
        }
    });
</script>

</body>
</html>
